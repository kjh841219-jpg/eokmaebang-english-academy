<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>벌교미래엔영어 숙제 제출</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      background: linear-gradient(180deg, #eaf8f2 0%, #f8fbff 100%);
      color: #09231b;
    }
    main { width: min(680px, 100%); margin: 0 auto; padding: 28px 18px 48px; }
    .brand { display: inline-flex; padding: 8px 14px; border-radius: 999px; background: #dff8ea; color: #076046; font-weight: 900; font-size: 13px; }
    h1 { margin: 14px 0 8px; font-size: clamp(28px, 8vw, 42px); letter-spacing: 0; }
    .sub { margin: 0 0 18px; color: #52665e; line-height: 1.55; }
    .panel, .result {
      background: #fff;
      border: 1px solid #cfe5da;
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(12, 74, 55, .08);
      padding: 18px;
      margin: 14px 0;
    }
    label { display: block; font-size: 13px; color: #375a4c; font-weight: 900; margin: 12px 0; }
    input, select, textarea {
      width: 100%;
      margin-top: 7px;
      border: 1px solid #c9e2d7;
      border-radius: 14px;
      padding: 13px;
      background: #fbfffd;
      font-size: 16px;
      color: #10261d;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 78px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .drop {
      border: 2px dashed #9fd2bd;
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      background: #f7fffb;
      cursor: pointer;
      margin: 14px 0;
    }
    .drop strong { display: block; font-size: 18px; margin-bottom: 8px; }
    .drop p { margin: 0; color: #547065; line-height: 1.55; }
    .previews {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin: 12px 0;
    }
    .preview {
      border: 1px solid #dbece4;
      border-radius: 14px;
      padding: 8px;
      background: #fbfffd;
    }
    .preview img {
      width: 100%;
      height: 130px;
      object-fit: contain;
      background: #fff;
      border-radius: 10px;
    }
    .preview div { font-size: 12px; color: #547065; word-break: break-all; margin-top: 5px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    button {
      border: 0;
      border-radius: 15px;
      padding: 14px 16px;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      min-height: 52px;
    }
    .primary { background: #08764f; color: #fff; flex: 1; }
    .ghost { background: #edf7f3; color: #073f2d; border: 1px solid #bcded0; }
    .choice { width: 100%; margin-top: 8px; text-align: left; background: #eefbf3; color: #064e3b; border: 1px solid #b8e6c8; }
    .notice { margin-top: 14px; padding: 14px; border-radius: 14px; background: #fff8dd; border: 1px solid #ead083; color: #6b4e03; line-height: 1.55; }
    .ok { background: #eefbf3; border-color: #b8e6c8; color: #065f46; }
    .error { color: #b42318; background: #fff1f0; border-color: #ffb4ad; }
    .hidden { display: none; }
    .spinner {
      width: 28px;
      height: 28px;
      border: 4px solid #dcebe3;
      border-top-color: #08764f;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 560px) {
      .row, .toolbar { grid-template-columns: 1fr; flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <span class="brand">벌교미래엔영어</span>
    <h1>숙제 사진 제출</h1>
    <p class="sub">휴대폰 번호 뒷자리 4자리를 입력하고 숙제 사진을 올려 주세요. 제출하면 학원 대시보드에 바로 반영됩니다.</p>

    <section class="panel">
      <label>학생 또는 보호자 휴대폰 번호 뒷자리 4자리
        <input id="last4" inputmode="numeric" maxlength="4" placeholder="예: 2588" />
      </label>
      <div id="studentChoiceBox" class="hidden"></div>
      <div class="row">
        <label>숙제명
          <input id="title" placeholder="예: Grammar Fun Unit 3 워크북" />
        </label>
        <label>교재/과목
          <input id="subject" placeholder="예: Grammar Fun 2" />
        </label>
      </div>
      <label>선생님께 남길 말
        <textarea id="memo" placeholder="예: 3번, 5번이 어려웠어요."></textarea>
      </label>

      <div class="drop" onclick="document.getElementById('photos').click()" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropPhotos(event)">
        <strong>숙제 사진 올리기</strong>
        <p>사진을 찍거나 앨범에서 선택하세요. 최대 4장까지 제출됩니다.</p>
        <input id="photos" class="hidden" type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg" multiple onchange="pickPhotos(event)" />
      </div>
      <div id="previewBox" class="previews"></div>
      <div class="toolbar">
        <button class="primary" type="button" onclick="submitHomework()">숙제 제출하기</button>
        <button class="ghost" type="button" onclick="clearPhotos()">사진 비우기</button>
      </div>
      <div id="status" class="notice">사진은 자동으로 용량을 줄여 제출됩니다.</div>
    </section>

    <section id="result" class="result hidden"></section>
  </main>

  <script>
    const PUBLIC_API_BASE = "https://beolgyo-miraen-growth-api.vercel.app";
    const API_BASE = location.hostname.endsWith("vercel.app") ? "" : PUBLIC_API_BASE;
    const params = new URLSearchParams(location.search);
    let selectedStudentId = params.get("studentId") || "";
    let photoItems = [];

    function apiUrl(path) {
      return `${API_BASE}${path}`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
    }

    function setStatus(text, type = "") {
      const el = document.getElementById("status");
      el.className = `notice ${type}`.trim();
      el.innerHTML = text;
    }

    function dragOver(event) {
      event.preventDefault();
      event.currentTarget.style.background = "#edfdf6";
    }

    function dragLeave(event) {
      event.preventDefault();
      event.currentTarget.style.background = "#f7fffb";
    }

    function dropPhotos(event) {
      event.preventDefault();
      event.currentTarget.style.background = "#f7fffb";
      setPhotos(Array.from(event.dataTransfer.files || []));
    }

    function pickPhotos(event) {
      setPhotos(Array.from(event.target.files || []));
    }

    async function setPhotos(files) {
      const images = files.filter(file => /^image\/(png|jpeg|jpg)$/i.test(file.type) || /\.(png|jpe?g)$/i.test(file.name)).slice(0, 4);
      photoItems = [];
      for (const file of images) {
        const dataUrl = await compressImage(file);
        photoItems.push({name: file.name, dataUrl});
      }
      renderPreviews();
      setStatus(photoItems.length ? `${photoItems.length}장의 사진이 준비되었습니다.` : "제출할 사진을 선택해 주세요.");
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("사진을 읽지 못했습니다."));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("사진 파일을 열지 못했습니다."));
          img.onload = () => {
            const max = 1200;
            const ratio = Math.min(1, max / Math.max(img.width, img.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(img.width * ratio));
            canvas.height = Math.max(1, Math.round(img.height * ratio));
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.72));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function renderPreviews() {
      document.getElementById("previewBox").innerHTML = photoItems.map((item, index) => `
        <div class="preview">
          <img src="${item.dataUrl}" alt="숙제 사진 ${index + 1}" />
          <div>${index + 1}. ${escapeHtml(item.name)}</div>
        </div>
      `).join("");
    }

    function clearPhotos() {
      photoItems = [];
      document.getElementById("photos").value = "";
      renderPreviews();
      setStatus("사진은 자동으로 용량을 줄여 제출됩니다.");
    }

    function showChoices(choices) {
      const box = document.getElementById("studentChoiceBox");
      box.className = "";
      box.innerHTML = `
        <div class="notice">같은 뒷자리 학생이 있습니다. 본인 이름을 선택해 주세요.</div>
        ${choices.map(choice => `<button type="button" class="choice" onclick="selectStudent('${choice.id}', '${escapeHtml(choice.name)}')">${escapeHtml(choice.name)} · ${escapeHtml(choice.classGroup || "반 미지정")}</button>`).join("")}
      `;
    }

    function selectStudent(id, name) {
      selectedStudentId = String(id);
      const box = document.getElementById("studentChoiceBox");
      box.className = "";
      box.innerHTML = `<div class="notice ok">${escapeHtml(name)} 학생으로 선택되었습니다.</div>`;
    }

    async function submitHomework() {
      const last4 = document.getElementById("last4").value.replace(/[^0-9]/g, "").slice(-4);
      const title = document.getElementById("title").value.trim() || "숙제 사진 제출";
      const subject = document.getElementById("subject").value.trim();
      const memo = document.getElementById("memo").value.trim();
      if (last4.length !== 4) return setStatus("휴대폰 번호 뒷자리 4자리를 입력해 주세요.", "error");
      if (!photoItems.length) return setStatus("제출할 숙제 사진을 선택해 주세요.", "error");

      setStatus(`<div style="display:flex;gap:12px;align-items:center;"><div class="spinner"></div><div><strong>숙제를 제출하고 AI가 사진을 확인하는 중입니다.</strong><br>잠시만 기다려 주세요.</div></div>`);
      document.querySelectorAll("button").forEach(button => button.disabled = true);

      try {
        const response = await fetch(apiUrl("/api/homework/analyze"), {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({studentSubmit: true, last4, selectedStudentId, title, subject, memo, images: photoItems})
        });
        const data = await response.json();
        if (data.needsSelection || data.needSelect) {
          document.querySelectorAll("button").forEach(button => button.disabled = false);
          showChoices(data.choices || data.result?.choices || []);
          setStatus("학생 이름을 선택한 뒤 다시 제출해 주세요.");
          return;
        }
        if (!response.ok || !data.ok) throw new Error(data.error || "숙제 제출에 실패했습니다.");
        const record = data.result?.record || {};
        setStatus("숙제가 정상 제출되었습니다. 원장님 대시보드에 곧 반영됩니다.", "ok");
        document.getElementById("result").classList.remove("hidden");
        document.getElementById("result").innerHTML = `
          <h2>제출 완료</h2>
          <p><strong>${escapeHtml(data.student?.name || record.name || "학생")}</strong> 학생 숙제가 제출되었습니다.</p>
          <p>상태: ${escapeHtml(record.status || "제출완료")} · 점수: ${Number(record.score || 0)}점</p>
          <p>${escapeHtml(record.summary || "선생님이 확인 후 피드백을 안내합니다.")}</p>
        `;
      } catch (error) {
        setStatus(`숙제 제출 실패: ${escapeHtml(error.message)}`, "error");
      } finally {
        document.querySelectorAll("button").forEach(button => button.disabled = false);
      }
    }

    if (params.get("last4")) document.getElementById("last4").value = params.get("last4").replace(/[^0-9]/g, "").slice(-4);
  </script>
</body>
</html>
