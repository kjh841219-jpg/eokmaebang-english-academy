<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>출결 관리자 | 벌교미래엔영어</title>
<style>:root{--g:#0f6848;--bg:#f1f8f5;--line:#cfe2d9;--text:#18372b}*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.wrap{max-width:1280px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head h1{margin:0;font-size:26px}.btn{border:0;border-radius:8px;background:var(--g);color:#fff;padding:11px 14px;font-weight:800;cursor:pointer}.btn.ghost{background:#fff;color:var(--g);border:1px solid var(--line)}.btn.red{background:#b83232}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px}.login{max-width:430px;margin:12vh auto}.login input{width:100%;padding:14px;border:1px solid var(--line);border-radius:8px;margin:10px 0}.hidden{display:none!important}.metrics{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:9px}.metric{background:#fff;border:1px solid var(--line);padding:12px;border-radius:8px}.metric strong{display:block;font-size:25px;margin-top:5px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:end}.toolbar label{font-size:12px;font-weight:800}.toolbar input,.toolbar select{display:block;padding:10px;border:1px solid var(--line);border-radius:7px;margin-top:4px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{border-bottom:1px solid #e3eee9;padding:10px 8px;text-align:left;font-size:13px}th{background:#f4faf7}.pill{padding:4px 8px;border-radius:99px;font-weight:800}.present{background:#dff5e9;color:#11663f}.late{background:#fff0d8;color:#9a5300}.absent{background:#fee4e4;color:#a12626}.makeup{background:#dcecff;color:#245b9d}.leave{background:#eee2fa;color:#6d329a}.missing{background:#ecefed;color:#65716b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid label{font-size:13px;font-weight:800}.grid input,.grid textarea,.grid select{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;margin-top:4px}.grid textarea{min-height:100px}.wide{grid-column:1/-1}.status{margin-top:10px;color:#536a60}@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.wrap{padding:10px}}@media print{.no-print,.login{display:none!important}.panel{border:0}.wrap{max-width:none}.table-wrap{overflow:visible}table{min-width:0}.head button{display:none}}</style></head>
<body><main class="wrap"><section id="login" class="panel login"><h1>출결 관리자 로그인</h1><p>관리자 비밀번호를 입력해 주세요.</p><input id="password" type="password" autocomplete="current-password"><button class="btn" onclick="login()">로그인</button><div id="loginError" class="status"></div></section>
<div id="app" class="hidden"><header class="head"><div><small>벌교미래엔영어</small><h1>오늘의 출결 관리</h1></div><div class="no-print"><a class="btn ghost" href="/student-attendance" target="_blank">학생 출결 화면</a> <button class="btn ghost" onclick="window.print()">인쇄</button> <button class="btn" onclick="downloadCsv()">엑셀 다운로드</button></div></header>
<section id="metrics" class="metrics panel"></section>
<section class="panel no-print"><div class="toolbar"><label>날짜<input id="dateFilter" type="date" onchange="render()"></label><label>학생 검색<input id="studentFilter" placeholder="학생 이름" oninput="render()"></label><label>상태<select id="statusFilter" onchange="render()"><option value="">전체</option><option>출석</option><option>지각</option><option>결석</option><option>보강</option><option>하원</option><option>미출석</option></select></label><button class="btn ghost" onclick="setMissingOnly()">미출석만 보기</button><button class="btn" onclick="loadData()">새로고침</button></div></section>
<section class="panel"><h2>출결 현황</h2><div class="table-wrap"><table><thead><tr><th>학생</th><th>학교·학년</th><th>등원</th><th>하원</th><th>상태</th><th>문자 연결</th><th class="no-print">관리</th></tr></thead><tbody id="attendanceBody"></tbody></table></div></section>
<section class="panel no-print"><h2>출결 수동 등록</h2><div class="toolbar"><label>학생<select id="manualStudent"></select></label><label>상태<select id="manualStatus"><option value="present">출석</option><option value="late">지각</option><option value="absent">결석</option><option value="makeup">보강</option><option value="leave">하원</option></select></label><label>날짜<input id="manualDate" type="date"></label><label>시간<input id="manualTime" type="time"></label><label>메모<input id="manualMemo"></label><button class="btn" onclick="createRecord()">저장</button></div></section>
<section class="panel no-print"><h2>학생·학부모 연락처 수정</h2><div class="toolbar"><label>학생<select id="editStudent" onchange="fillStudent()"></select></label><label>학생 전화<input id="studentPhone"></label><label>학부모 이름<input id="parentName"></label><label>학부모 전화<input id="parentPhone"></label><label>학교<input id="school"></label><label>학년<input id="grade"></label><label>수강반<input id="classGroup"></label><label>메모<input id="studentMemo"></label><button class="btn" onclick="saveStudent()">학생정보 저장</button></div></section>
<section class="panel no-print"><h2>출결 문자 설정</h2><div class="grid"><label>학원명<input id="academyName"></label><label>이모지 사용<select id="useEmoji"><option value="true">사용</option><option value="false">사용 안 함</option></select></label><label>출석 문자<textarea id="tpl-present"></textarea></label><label>지각 문자<textarea id="tpl-late"></textarea></label><label>결석 문자<textarea id="tpl-absent"></textarea></label><label>보강 문자<textarea id="tpl-makeup"></textarea></label><label class="wide">하원 문자<textarea id="tpl-leave"></textarea></label></div><button class="btn" onclick="saveSettings()">문자 설정 저장</button><div class="status">사용 변수: {name}, {date}, {time}, {status}, {emoji}</div></section><div id="status" class="status"></div></div></main>
<script>
const API="/api/attendance/admin";let password="",students=[],records=[],settings={};const $=id=>document.getElementById(id);const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul"}).format(new Date());
async function call(method="GET",body){const res=await fetch(API,{method,headers:{"Content-Type":"application/json","x-attendance-admin-password":password},body:body?JSON.stringify(body):undefined,cache:"no-store"});const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||"요청 실패");return data}
async function login(){password=$("password").value;try{sessionStorage.setItem("attendanceAdminPassword",password);await loadData();$("login").classList.add("hidden");$("app").classList.remove("hidden")}catch(e){$("loginError").textContent=e.message}}
async function loadData(){const d=await call();students=d.students||[];records=d.attendanceRecords||[];settings=d.attendanceSettings||{};fillSelects();fillSettings();render()}
function fillSelects(){const html=students.map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.classGroup||"")}</option>`).join("");$("manualStudent").innerHTML=html;$("editStudent").innerHTML=html;fillStudent()}
function recordsFor(date){return records.filter(r=>r.date===date)}function latestBy(stu,date){return recordsFor(date).filter(r=>String(r.studentId)===String(stu.id)).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))}
function render(){const date=$("dateFilter").value||today,key=$("studentFilter").value.trim(),filter=$("statusFilter").value;const day=recordsFor(date);const counts={출석:0,지각:0,결석:0,보강:0,하원:0};day.forEach(r=>{if(counts[r.status]!=null)counts[r.status]++});const attended=new Set(day.filter(r=>r.status!=="하원").map(r=>String(r.studentId)));const missing=Math.max(0,students.length-attended.size);$("metrics").innerHTML=[["전체",students.length],["출석",counts.출석],["지각",counts.지각],["결석",counts.결석],["보강",counts.보강],["하원",counts.하원],["미출석",missing]].map(x=>`<div class="metric">${x[0]}<strong>${x[1]}명</strong></div>`).join("");
const rows=students.map(s=>{const rs=latestBy(s,date),latest=rs[0],arrival=rs.find(r=>["출석","지각","보강"].includes(r.status)),leave=rs.find(r=>r.status==="하원"),status=latest?.status||"미출석";return{s,latest,arrival,leave,status}}).filter(x=>(!key||x.s.name.includes(key))&&(!filter||x.status===filter));$("attendanceBody").innerHTML=rows.map(x=>`<tr><td><b>${esc(x.s.name)}</b></td><td>${esc(x.s.school||"-")} · ${esc(x.s.grade||"-")}</td><td>${esc(x.arrival?.time||"-")}</td><td>${esc(x.leave?.time||"-")}</td><td><span class="pill ${code(x.status)}">${x.status}</span></td><td>${esc(x.latest?.parentSent||"-")}</td><td class="no-print">${x.latest?`<button class="btn ghost" onclick="editRecord('${x.latest.id}')">수정</button> <button class="btn red" onclick="deleteRecord('${x.latest.id}')">삭제</button> ${x.latest.smsUrl?`<a class="btn" href="${x.latest.smsUrl}">문자 앱</a>`:""}`:"-"}</td></tr>`).join("")||`<tr><td colspan="7">조건에 맞는 학생이 없습니다.</td></tr>`}
function code(s){return({출석:"present",지각:"late",결석:"absent",보강:"makeup",하원:"leave",미출석:"missing"})[s]||"missing"}function setMissingOnly(){$("statusFilter").value="미출석";render()}
async function createRecord(){await mutate({action:"create-record",studentId:$("manualStudent").value,statusCode:$("manualStatus").value,date:$("manualDate").value,time:$("manualTime").value,memo:$("manualMemo").value})}
async function editRecord(id){const r=records.find(x=>x.id===id);const time=prompt("수정할 출결 시간을 입력하세요.",r.time);if(time===null)return;const memo=prompt("관리 메모를 입력하세요.",r.memo||"");if(memo===null)return;await mutate({action:"update-record",id,patch:{time,memo}})}async function deleteRecord(id){if(confirm("선택한 출결 기록 한 건을 삭제할까요?"))await mutate({action:"delete-record",id})}
function fillStudent(){const s=students.find(x=>String(x.id)===$("editStudent").value)||students[0];if(!s)return;$("studentPhone").value=s.studentPhone||"";$("parentName").value=s.parentName||"";$("parentPhone").value=s.phone||"";$("school").value=s.school||"";$("grade").value=s.grade||"";$("classGroup").value=s.classGroup||"";$("studentMemo").value=s.attendanceMemo||s.note||""}
async function saveStudent(){await mutate({action:"save-student",student:{id:$("editStudent").value,studentPhone:$("studentPhone").value,parentName:$("parentName").value,phone:$("parentPhone").value,school:$("school").value,grade:$("grade").value,classGroup:$("classGroup").value,attendanceMemo:$("studentMemo").value}})}
function fillSettings(){$("academyName").value=settings.academyName||"";$("useEmoji").value=String(settings.useEmoji!==false);["present","late","absent","makeup","leave"].forEach(k=>$("tpl-"+k).value=settings.templates?.[k]||"")}
async function saveSettings(){const templates={};["present","late","absent","makeup","leave"].forEach(k=>templates[k]=$("tpl-"+k).value);await mutate({action:"save-settings",settings:{academyName:$("academyName").value,useEmoji:$("useEmoji").value==="true",templates}})}
async function mutate(body){try{const d=await call("POST",body);students=d.students;records=d.attendanceRecords;settings=d.attendanceSettings;fillSelects();fillSettings();render();$("status").textContent="저장되었습니다."}catch(e){alert(e.message)}}
function downloadCsv(){const date=$("dateFilter").value||today,rows=[["날짜","학생","학교","학년","상태","시간","문자연결","메모"],...recordsFor(date).map(r=>{const s=students.find(x=>String(x.id)===String(r.studentId))||{};return[r.date,r.name,s.school||"",s.grade||"",r.status,r.time,r.parentSent||"",r.memo||""]})];const csv="\ufeff"+rows.map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`출결기록_${date}.csv`;a.click();URL.revokeObjectURL(a.href)}function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
$("dateFilter").value=today;$("manualDate").value=today;$("manualTime").value=new Date().toLocaleTimeString("en-GB",{timeZone:"Asia/Seoul",hour:"2-digit",minute:"2-digit"});password=sessionStorage.getItem("attendanceAdminPassword")||"";if(password){$("password").value=password;login()}setInterval(()=>{if(!$("app").classList.contains("hidden")&&!document.hidden)loadData().catch(()=>{})},10000);
</script></body></html>
