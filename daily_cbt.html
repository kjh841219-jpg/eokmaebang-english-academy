<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>벌교미래엔영어 Daily CBT</title>
  <style>
    :root { --green:#0f6b4a; --mint:#eaf7f1; --line:#cfe5da; --blue:#2563eb; --amber:#b7791f; --text:#10251c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Malgun Gothic", Arial, sans-serif; color:var(--text); background:linear-gradient(180deg,#eefbf5 0%,#f7fbf8 100%); }
    main { width:min(940px, calc(100% - 28px)); margin:0 auto; padding:32px 0 46px; }
    .brand { display:inline-flex; margin:0 auto 10px; padding:8px 14px; border-radius:999px; color:var(--green); background:#dff8ea; font-weight:900; }
    .hero { text-align:center; margin-bottom:22px; }
    h1 { margin:10px 0 8px; font-size:clamp(28px, 7vw, 42px); letter-spacing:0; }
    h2 { margin:0 0 12px; font-size:22px; }
    .sub { margin:0; color:#52665e; line-height:1.55; }
    .panel, .question, .result { background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:0 18px 46px rgba(15,84,58,.08); margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
    label { display:grid; gap:7px; font-size:14px; font-weight:800; }
    select, input { width:100%; border:1px solid #bcd9cc; border-radius:12px; padding:13px 14px; font-size:16px; background:#fbfffd; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    button, a.button { border:1px solid #bcd9cc; border-radius:12px; padding:12px 16px; font-weight:900; cursor:pointer; background:#fff; color:#0d3a2a; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
    button.primary { background:#147c57; color:#fff; border-color:#147c57; }
    button.blue { background:var(--blue); color:#fff; border-color:var(--blue); }
    button.amber { background:var(--amber); color:#fff; border-color:var(--amber); }
    button.ghost { background:#f7fffb; }
    .notice { margin-top:14px; padding:14px; border-radius:14px; background:#fff8dd; border:1px solid #ead083; color:#6b4e03; line-height:1.55; }
    .ok { background:#eefbf3; border-color:#b8e6c8; color:#065f46; }
    .error { color:#b42318; background:#fff1f0; border-color:#ffb4ad; }
    .question { box-shadow:none; break-inside:avoid; }
    .question-title { display:flex; gap:8px; align-items:center; justify-content:space-between; font-weight:900; margin-bottom:10px; }
    .badge { border-radius:999px; padding:5px 9px; background:#e8f3ff; color:#1d4ed8; font-size:12px; }
    .script { margin:8px 0 12px; padding:12px; border-radius:12px; background:#f1f5f9; color:#334155; line-height:1.55; }
    .choices { display:grid; gap:8px; margin-top:10px; }
    .choice { display:flex; gap:8px; align-items:flex-start; border:1px solid #d9e9e1; border-radius:12px; padding:10px; background:#fbfffd; }
    .result { border-color:#9bd6be; background:#f8fffb; }
    .hidden { display:none; }
    @media (max-width:760px) { main { width:min(100% - 24px, 520px); } .grid { grid-template-columns:1fr; } .toolbar { flex-direction:column; } button, a.button { width:100%; } }
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <span class="brand">벌교미래엔영어</span>
      <h1>Daily CBT 미니테스트</h1>
      <p class="sub">학생 이름을 선택하고 오늘의 듣기·단어·리딩 문제를 풀어 주세요.</p>
    </div>

    <section class="panel">
      <div class="grid">
        <label>학생 이름
          <select id="studentSelect" onchange="selectStudentFromDropdown()"></select>
        </label>
        <label>수준
          <select id="levelSelect" onchange="resetQuestions()"></select>
        </label>
        <label>유형
          <select id="typeSelect" onchange="resetQuestions()">
            <option value="daily">Daily 통합</option>
            <option value="listening">듣기</option>
            <option value="vocab">단어</option>
            <option value="reading">리딩</option>
          </select>
        </label>
      </div>
      <div class="toolbar">
        <button type="button" class="blue" onclick="sendLink('kakao')">CBT 링크 카카오 전송</button>
        <button type="button" class="amber" onclick="sendLink('sms')">CBT 링크 문자 전송</button>
      </div>
      <div id="statusBox" class="notice">문제를 불러오는 중입니다.</div>
    </section>

    <form id="testForm"></form>
    <div class="toolbar">
      <button type="button" class="ghost" onclick="resetQuestions()">랜덤 문제 다시 만들기</button>
      <button type="button" class="primary" onclick="submitDailyCbt()">제출하기</button>
    </div>
    <section id="resultBox" class="result hidden"></section>
  </main>

  <script>
    const PUBLIC_API_BASE = "https://beolgyo-miraen-growth-api.vercel.app";
    const API_BASE = location.hostname.endsWith("vercel.app") ? "" : PUBLIC_API_BASE;
    const params = new URLSearchParams(location.search);
    const levelLabels = ["초저", "초중", "초고", "중1", "중2", "중3", "고등"];
    const typeLabels = {daily:"Daily 통합", listening:"듣기", vocab:"단어", reading:"리딩"};
    const areaLabels = {listening:"듣기", vocab:"단어", reading:"리딩"};
    const state = {students:[], student:null, level:params.get("level") || "초저", type:params.get("type") || "daily", questions:[], seed:params.get("seed") || String(Date.now()), lastRecord:null};

    function apiUrl(path) { return `${API_BASE}${path}`; }
    function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char])); }
    function cleanPhone(value) { return String(value || "").replace(/\D/g, ""); }
    function todayKorea() { return new Date().toLocaleDateString("en-CA", {timeZone:"Asia/Seoul"}); }

    function defaultStudents() {
      return [
        {id:1, name:"김정해", phone:"010-4032-2588", studentPhone:"010-4032-2588", classGroup:"초등반"},
        {id:2, name:"박세훈", phone:"010-6670-7898", studentPhone:"", classGroup:"초등반"},
        {id:3, name:"박하윤", phone:"010-9761-0517", studentPhone:"010-5424-7898", classGroup:"초등반"}
      ];
    }

    function profile(level) {
      const map = {
        "초저": {word:"apple", meaning:"사과", sentence:"I eat an apple after lunch.", reading:"Tom has a red bag. He puts a book in it.", place:"classroom", item:"pencil", action:"open your book"},
        "초중": {word:"library", meaning:"도서관", sentence:"She goes to the library on Monday.", reading:"Jina visits the library after school. She reads a storybook and borrows one book.", place:"library", item:"notebook", action:"clean the classroom"},
        "초고": {word:"carefully", meaning:"조심스럽게", sentence:"Kevin checks his homework carefully.", reading:"Kevin wanted to finish his science poster. He checked each sentence carefully.", place:"Room 204", item:"umbrella", action:"practice the presentation"},
        "중1": {word:"promise", meaning:"약속하다", sentence:"I promised to help my friend.", reading:"Mina promised to help her group. She finished her part first.", place:"museum", item:"blue pen", action:"compare two stories"},
        "중2": {word:"environment", meaning:"환경", sentence:"We should protect the environment.", reading:"Many students wanted to reduce plastic waste. They brought their own cups.", place:"volunteer club", item:"form", action:"submit the form by Friday"},
        "중3": {word:"responsible", meaning:"책임감 있는", sentence:"A responsible student checks the deadline before starting homework.", reading:"Although the project was difficult, Eric made a plan and finished it on time.", place:"online review site", item:"feedback", action:"revise essays after feedback"},
        "고등": {word:"analyze", meaning:"분석하다", sentence:"Students should analyze the writer's purpose.", reading:"When readers analyze an article, they should examine how details support the writer's purpose.", place:"lecture hall", item:"evidence", action:"explain the reason behind a mistake"}
      };
      return map[level] || map["초저"];
    }

    function listeningQuestions(level) {
      const p = profile(level);
      return [
        {area:"listening", script:`A student says, "Please ${p.action}."`, prompt:"듣기 스크립트의 핵심 행동으로 알맞은 것을 고르시오.", choices:[p.action, "close the store", "buy a ticket", "draw a map"], answer:"1", explanation:`${p.action}이 핵심 행동입니다.`},
        {area:"listening", script:`The teacher says the class will meet in the ${p.place}.`, prompt:"듣기 내용에서 만날 장소로 알맞은 것을 고르시오.", choices:[p.place, "hospital", "market", "station"], answer:"1", explanation:`만날 장소는 ${p.place}입니다.`},
        {area:"listening", script:`Mina needs a ${p.item} for English class today.`, prompt:"Mina에게 필요한 물건으로 알맞은 것을 고르시오.", choices:[p.item, "soccer ball", "sandwich", "camera"], answer:"1", explanation:`필요한 물건은 ${p.item}입니다.`},
        {area:"listening", script:"The student finished the homework before dinner.", prompt:"학생이 숙제를 끝낸 때는 언제인가요?", choices:["before dinner", "after midnight", "next Monday", "during lunch"], answer:"1", explanation:"before dinner가 시간 정보입니다."},
        {area:"listening", script:"The speaker is asking students to check their answers one more time.", prompt:"화자가 학생들에게 요청한 행동은 무엇인가요?", choices:["check answers again", "leave the room", "skip the test", "erase all notes"], answer:"1", explanation:"check their answers one more time이 요청입니다."}
      ];
    }

    function vocabQuestions(level) {
      const p = profile(level);
      return [
        {area:"vocab", prompt:`"${p.word}"의 뜻으로 알맞은 것을 고르시오.`, choices:[p.meaning, "창문", "갑자기", "예약하다"], answer:"1", explanation:`${p.word}의 뜻은 ${p.meaning}입니다.`},
        {area:"vocab", prompt:`빈칸에 알맞은 단어를 고르시오.\n${p.sentence.replace(p.word, "_____")}`, choices:[p.word, "chair", "blue", "under"], answer:"1", explanation:"문맥에 맞는 학습 단어를 고릅니다."},
        {area:"vocab", prompt:`"${p.word}"를 자연스럽게 사용한 문장을 고르시오.`, choices:[p.sentence, "She blue under.", "The table runs an idea.", "Winter spoon arrives."], answer:"1", explanation:"단어가 문장 속에서 자연스럽게 쓰인 문장입니다."},
        {area:"vocab", prompt:`우리말 "${p.meaning}"에 해당하는 영어 단어는 무엇인가요?`, choices:[p.word, "window", "slowly", "arrive"], answer:"1", explanation:`정답은 ${p.word}입니다.`},
        {area:"vocab", prompt:"문맥상 가장 알맞은 단어를 고르시오.", choices:[p.word, "noise", "spoon", "winter"], answer:"1", explanation:"학습 문맥과 연결되는 단어를 고릅니다."}
      ];
    }

    function readingQuestions(level) {
      const p = profile(level);
      return [
        {area:"reading", passage:p.reading, prompt:"글의 중심 내용으로 알맞은 것을 고르시오.", choices:["A student completes a task carefully.", "A student loses a bag.", "A family buys fruit.", "A teacher closes school."], answer:"1", explanation:"글 전체 행동과 결과를 요약한 선택지입니다."},
        {area:"reading", passage:p.reading, prompt:"글의 내용과 일치하는 것을 고르시오.", choices:["The student does the task.", "The student never studies.", "The story is about cooking only.", "The teacher is angry."], answer:"1", explanation:"지문에 드러난 행동을 확인합니다."},
        {area:"reading", passage:p.reading, prompt:"밑줄 친 행동의 이유로 가장 알맞은 것을 고르시오.", choices:["to finish the work well", "to avoid all classes", "to buy new shoes", "to make noise"], answer:"1", explanation:"글의 흐름상 과제를 잘 끝내기 위한 행동입니다."},
        {area:"reading", passage:p.reading, prompt:"글의 분위기로 알맞은 것을 고르시오.", choices:["responsible", "careless", "angry", "unfair"], answer:"1", explanation:"계획하고 확인하는 태도는 responsible에 가깝습니다."},
        {area:"reading", passage:p.reading, prompt:"다음에 이어질 내용으로 가장 자연스러운 것을 고르시오.", choices:["The teacher checks the work and gives feedback.", "The student throws the work away.", "The class stops learning English.", "Everyone leaves without speaking."], answer:"1", explanation:"학습 과제 뒤에는 확인과 피드백이 자연스럽습니다."}
      ];
    }

    function seededShuffle(items, seedText) {
      let seed = Array.from(String(seedText)).reduce((sum, char) => sum + char.charCodeAt(0), 0) || 1;
      const next = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const copy = items.slice();
      for (let i = copy.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [copy[i], copy[j]] = [copy[j], copy[i]]; }
      return copy;
    }

    function chooseQuestions() {
      const groups = state.type === "daily" ? ["listening", "vocab", "reading"] : [state.type];
      const pool = groups.flatMap(type => type === "listening" ? listeningQuestions(state.level) : type === "vocab" ? vocabQuestions(state.level) : readingQuestions(state.level));
      state.questions = seededShuffle(pool, `${state.seed}:${state.level}:${state.type}`);
    }

    function renderSelectors() {
      const studentSelect = document.getElementById("studentSelect");
      studentSelect.innerHTML = state.students.map(student => {
        const meta = [student.classGroup, student.school].filter(Boolean).join(" · ");
        return `<option value="${escapeHtml(student.id)}">${escapeHtml(student.name)}${meta ? " · " + escapeHtml(meta) : ""}</option>`;
      }).join("");
      if (state.student?.id) studentSelect.value = String(state.student.id);
      document.getElementById("levelSelect").innerHTML = levelLabels.map(level => `<option value="${level}">${level}</option>`).join("");
      document.getElementById("levelSelect").value = state.level;
      document.getElementById("typeSelect").value = state.type;
    }

    function selectStudentFromDropdown() {
      const id = document.getElementById("studentSelect").value;
      state.student = state.students.find(item => String(item.id) === String(id)) || state.students[0] || null;
      renderStatus();
    }

    function renderStatus(message = "") {
      const studentName = state.student?.name || "학생";
      document.getElementById("statusBox").className = "notice";
      document.getElementById("statusBox").textContent = message || `${studentName} 학생 · ${state.level} · ${typeLabels[state.type]} · 총 ${state.questions.length}문항`;
    }

    function resetQuestions() {
      state.level = document.getElementById("levelSelect").value || "초저";
      state.type = document.getElementById("typeSelect").value || "daily";
      state.seed = String(Date.now());
      state.lastRecord = null;
      chooseQuestions();
      renderQuestions();
      renderStatus();
      document.getElementById("resultBox").classList.add("hidden");
    }

    function renderQuestions() {
      document.getElementById("testForm").innerHTML = state.questions.map((q, index) => `
        <section class="question">
          <div class="question-title"><span>${index + 1}. ${escapeHtml(q.prompt)}</span><span class="badge">${escapeHtml(areaLabels[q.area] || q.area)}</span></div>
          ${q.script ? `<div class="script"><b>듣기 스크립트</b><br>${escapeHtml(q.script)}</div>` : ""}
          ${q.passage ? `<div class="script">${escapeHtml(q.passage)}</div>` : ""}
          <div class="choices">
            ${q.choices.map((choice, choiceIndex) => `
              <label class="choice"><input type="radio" name="answer${index}" value="${choiceIndex + 1}" /> <span>${choiceIndex + 1}. ${escapeHtml(choice)}</span></label>
            `).join("")}
          </div>
        </section>
      `).join("");
    }

    function buildCbtUrl() {
      const url = new URL(`${PUBLIC_API_BASE}/daily-cbt`);
      if (state.student?.id) url.searchParams.set("studentId", state.student.id);
      if (state.student?.name) url.searchParams.set("name", state.student.name);
      url.searchParams.set("level", state.level);
      url.searchParams.set("type", state.type);
      url.searchParams.set("seed", state.seed);
      return url.toString();
    }

    function dailyMiniAreaSummary(record) {
      return Object.entries(record.areas || {}).map(([key, value]) => `${areaLabels[key] || key} ${value.correct}/${value.total}`).join(", ");
    }

    function resultMessage(record = state.lastRecord) {
      if (!record) return "";
      const guide = record.score >= 80 ? "오늘 학습 내용은 안정적으로 이해했습니다. 같은 유형을 짧게 복습하면 더 탄탄해집니다." : "오늘 틀린 문항은 다시 듣고, 단어 뜻과 지문 근거를 한 번 더 확인하겠습니다.";
      return `안녕하세요. 벌교미래엔영어입니다.\n\n${record.name} 학생 Daily CBT 결과 안내드립니다.\n수준/유형: ${record.level} · ${record.type}\n점수: ${record.score}점 (${record.correct}/${record.total})\n영역별 결과: ${dailyMiniAreaSummary(record) || "-"}\n\n${guide}`;
    }

    function linkMessage() {
      const studentName = state.student?.name || "학생";
      return `안녕하세요. 벌교미래엔영어입니다.\n\n${studentName} 학생 Daily CBT 링크를 보내드립니다.\n아래 주소를 눌러 오늘의 듣기·단어·리딩 미니테스트를 진행해 주세요.\n\n${buildCbtUrl()}`;
    }

    async function sendMessage(channel, text, variables = {}) {
      const student = state.student || {};
      const phone = cleanPhone(student.phone || student.parentPhone || student.guardianPhone);
      if (phone.length < 10) throw new Error("학부모 연락처가 없습니다. 대시보드 학생관리에서 학부모 번호를 확인해 주세요.");
      const endpoint = channel === "kakao" ? "/api/kakao/send" : "/api/sms/send";
      const response = await fetch(apiUrl(endpoint), {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(channel === "kakao" ? {to:phone, text, kind:"daily", variables} : {to:phone, text})});
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.error || "발송 실패");
      return {channel:channel === "kakao" ? "카카오" : "문자", data};
    }

    async function sendLink(channel) {
      selectStudentFromDropdown();
      renderStatus(channel === "kakao" ? "CBT 링크를 카카오로 전송하는 중입니다." : "CBT 링크를 문자로 전송하는 중입니다.");
      try {
        const name = state.student?.name || "학생";
        const result = await sendMessage(channel, linkMessage(), {"#{학생명}":name, "#{내용}":`${name} 학생 Daily CBT 링크입니다. ${buildCbtUrl()}`, "#{날짜}":todayKorea(), "#{학습내용}":`${state.level} ${typeLabels[state.type]} Daily CBT`, "#{결과}":"CBT 진행 전"});
        document.getElementById("statusBox").className = "notice ok";
        document.getElementById("statusBox").textContent = `CBT 링크 ${result.channel} 발송 접수 완료`;
      } catch (error) {
        document.getElementById("statusBox").className = "notice error";
        document.getElementById("statusBox").textContent = `CBT 링크 발송 실패: ${error.message}`;
      }
    }

    async function sendResult(channel) {
      if (!state.lastRecord) return alert("먼저 CBT를 제출해 주세요.");
      const resultBox = document.getElementById("resultBox");
      try {
        const record = state.lastRecord;
        const result = await sendMessage(channel, resultMessage(record), {"#{학생명}":record.name, "#{내용}":`${record.level} ${record.type} ${record.score}점 (${record.correct}/${record.total})`, "#{날짜}":record.date, "#{학습내용}":`${record.level} ${record.type} Daily CBT`, "#{결과}":`${record.score}점`});
        resultBox.insertAdjacentHTML("beforeend", `<div class="notice ok">결과 ${escapeHtml(result.channel)} 발송 접수 완료</div>`);
      } catch (error) {
        resultBox.insertAdjacentHTML("beforeend", `<div class="notice error">결과 발송 실패: ${escapeHtml(error.message)}</div>`);
      }
    }

    function dailyExportPayload(record) { return {type:"daily_cbt_result", exportedAt:new Date().toISOString(), app:"Beolgyo MiraeN Daily CBT", record}; }
    function downloadJsonFile(filename, payload) {
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json;charset=utf-8"});
      const anchor = document.createElement("a");
      anchor.href = URL.createObjectURL(blob);
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      URL.revokeObjectURL(anchor.href);
      anchor.remove();
    }
    function dailyResultFileName(record = state.lastRecord) {
      const safeName = String(record?.name || "학생").replace(/[\\/:*?"<>|]/g, "_");
      return `Daily_CBT_결과_${safeName}_${record?.date || todayKorea()}.json`;
    }
    function downloadLastDailyResult() { if (state.lastRecord) downloadJsonFile(dailyResultFileName(state.lastRecord), dailyExportPayload(state.lastRecord)); }
    async function copyLastDailyResult() {
      if (!state.lastRecord) return;
      try {
        await navigator.clipboard.writeText(resultMessage(state.lastRecord));
        document.getElementById("resultBox").insertAdjacentHTML("beforeend", `<div class="notice ok">결과 문구를 복사했습니다.</div>`);
      } catch {
        document.getElementById("resultBox").insertAdjacentHTML("beforeend", `<div class="notice error">복사 권한이 막혀 있습니다. 결과 문구를 직접 선택해 복사해 주세요.</div>`);
      }
    }
    async function shareLastDailyResult() {
      if (!state.lastRecord) return;
      if (navigator.share) {
        try { await navigator.share({title:"Daily CBT 결과", text:resultMessage(state.lastRecord)}); return; } catch (_) {}
      }
      await copyLastDailyResult();
    }

    async function loadDailyCbt() {
      try {
        const response = await fetch(apiUrl("/api/dashboard/state"), {cache:"no-store"});
        const data = await response.json();
        if (!data.ok) throw new Error(data.error || "state error");
        state.students = Array.isArray(data.students) && data.students.length ? data.students : defaultStudents();
        state.student = state.students.find(item => String(item.id) === String(params.get("studentId"))) || state.students.find(item => item.name === params.get("name")) || state.students[0] || null;
      } catch {
        state.students = defaultStudents();
        state.student = state.students.find(item => item.name === params.get("name")) || state.students[0] || null;
        document.getElementById("statusBox").className = "notice error";
      }
      renderSelectors();
      chooseQuestions();
      renderQuestions();
      renderStatus();
    }

    async function submitDailyCbt() {
      selectStudentFromDropdown();
      let correct = 0;
      const areas = {};
      state.questions.forEach((q, index) => {
        const answer = document.querySelector(`input[name="answer${index}"]:checked`)?.value || "";
        const area = q.area || state.type;
        if (!areas[area]) areas[area] = {correct:0, total:0, score:0};
        areas[area].total += 1;
        if (answer === String(q.answer)) { correct += 1; areas[area].correct += 1; }
      });
      Object.values(areas).forEach(area => { area.score = area.total ? Math.round((area.correct / area.total) * 100) : 0; });
      const total = state.questions.length;
      const score = total ? Math.round((correct / total) * 100) : 0;
      const now = new Date();
      const record = {
        date: todayKorea(),
        time: now.toLocaleTimeString("ko-KR", {hour:"2-digit", minute:"2-digit", hour12:false}),
        studentId: state.student?.id || params.get("studentId") || "",
        name: state.student?.name || params.get("name") || "학생",
        phone: state.student?.phone || "",
        level: state.level,
        type: typeLabels[state.type] || state.type,
        typeKey: state.type,
        score,
        correct,
        total,
        areas,
        memo: score >= 80 ? "안정" : "보완필요",
        source: "url-cbt"
      };
      state.lastRecord = record;
      let saved = false;
      try {
        const response = await fetch(apiUrl("/api/daily-mini/submit"), {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(record)});
        const data = await response.json().catch(() => ({}));
        saved = response.ok && data.ok;
      } catch (_) {}
      if (!saved) {
        const local = JSON.parse(localStorage.getItem("beolgyo-daily-cbt-submissions") || "[]");
        local.unshift(record);
        localStorage.setItem("beolgyo-daily-cbt-submissions", JSON.stringify(local.slice(0, 50)));
      }
      document.getElementById("resultBox").classList.remove("hidden");
      document.getElementById("resultBox").innerHTML = `
        <h2>제출 완료</h2>
        <p><b>${escapeHtml(record.name)}</b> 학생 점수는 <b>${score}점</b>입니다. (${correct}/${total})</p>
        <p>${saved ? "학원 대시보드 Daily 미니테스트 기록에 반영했습니다." : "서버 저장소가 불안정하여 이 기기에 임시 저장했습니다. 아래 JSON 파일을 저장한 뒤 원장님 대시보드에서 가져오면 반영됩니다."}</p>
        <div class="toolbar">
          <button type="button" class="blue" onclick="sendResult('kakao')">결과 카카오 전송</button>
          <button type="button" class="amber" onclick="sendResult('sms')">결과 문자 전송</button>
          <button type="button" class="primary" onclick="downloadLastDailyResult()">결과 JSON 저장</button>
          <button type="button" class="ghost" onclick="copyLastDailyResult()">결과 복사</button>
          <button type="button" class="ghost" onclick="shareLastDailyResult()">휴대폰 공유</button>
        </div>
      `;
      window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});
    }

    loadDailyCbt();
  </script>
</body>
</html>
